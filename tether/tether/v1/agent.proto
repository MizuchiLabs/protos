edition = "2023";

package tether.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents"};
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }
  rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatResponse);
}

message Agent {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string address = 2 [(buf.validate.field).string.min_len = 1];
  bytes config = 3;
}

message GetAgentRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
message GetAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
message ListAgentsResponse {
  repeated Agent agents = 1;
}

message DeleteAgentRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteAgentResponse {}

message AgentHeartbeatRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bytes config = 2;
}
message AgentHeartbeatResponse {}
