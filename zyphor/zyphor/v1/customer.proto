edition = "2023";

package zyphor.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service CustomerService {
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/customers/subscription"};
  }
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutResponse) {
    option (google.api.http) = {post: "/v1/customers/checkout"};
  }
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {
    option (google.api.http) = {
      post: "/v1/customers/subscription/cancel"
      body: "*"
    };
  }
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_WORKSPACE = 1;
  RESOURCE_TYPE_MEMBER = 2;
  RESOURCE_TYPE_TEAM = 3;
  RESOURCE_TYPE_CA = 4;
  RESOURCE_TYPE_SA = 5;
  RESOURCE_TYPE_AGENT = 6;
  RESOURCE_TYPE_TARGET = 7;
}

message Subscription {
  string customer_id = 1;
  string product_id = 2;
  string product_name = 3;
  string status = 4;
  bool cancel_at_period_end = 5;
  google.protobuf.Timestamp current_period_end = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message QuotaInfo {
  repeated ResourceQuota resources = 1;
}

message ResourceQuota {
  ResourceType resource_type = 1;
  int32 current = 2;
  int32 limit = 3;
  int32 usage_percent = 4;
}

message GetSubscriptionRequest {}
message GetSubscriptionResponse {
  Subscription subscription = 1;
  QuotaInfo quota = 2;
}

message CreateCheckoutRequest {
  string product_id = 1;
}
message CreateCheckoutResponse {
  string checkout_url = 1;
}

message CancelSubscriptionRequest {
  bool immediate = 1;
  bool cancel_at_period_end = 2;
  string reason = 3 [(buf.validate.field).string.max_len = 1000];
}
message CancelSubscriptionResponse {}
