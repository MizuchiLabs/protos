edition = "2023";

package zyphor.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "zyphor/v1/options.proto";

service CustomerService {
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/customers/subscription"};
  }
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutResponse) {
    option (google.api.http) = {post: "/v1/customers/checkout"};
  }
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {
    option (google.api.http) = {
      post: "/v1/customers/subscription/cancel"
      body: "*"
    };
  }
}

enum PlanType {
  PLAN_TYPE_UNSPECIFIED = 0;
  PLAN_TYPE_TEAM = 1;
  PLAN_TYPE_BUSINESS = 2;
  PLAN_TYPE_ENTERPRISE = 3;
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_WORKSPACE = 1;
  RESOURCE_TYPE_MEMBER = 2;
  RESOURCE_TYPE_TEAM = 3;
  RESOURCE_TYPE_CA = 4;
  RESOURCE_TYPE_SA = 5;
  RESOURCE_TYPE_AGENT = 6;
  RESOURCE_TYPE_TARGET = 7;
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_ACTIVE = 1;
  SUBSCRIPTION_STATUS_CANCELLED = 2;
}

message Subscription {
  PlanType plan_type = 1;
  SubscriptionStatus status = 2;
  bool cancel_at_period_end = 3;
  google.protobuf.Timestamp current_period_end = 4;
  google.protobuf.Timestamp updated_at = 5;
}
message QuotaInfo {
  repeated ResourceQuota resources = 1;
}

message ResourceQuota {
  ResourceType resource_type = 1;
  int32 current = 2;
  int32 limit = 3;
  int32 usage_percent = 4;
}

message GetSubscriptionRequest {}
message GetSubscriptionResponse {
  Subscription subscription = 1 [(zyphor.v1.sensitive) = true];
  QuotaInfo quota = 2 [(zyphor.v1.sensitive) = true];
}

message CreateCheckoutRequest {
  PlanType plan_type = 1;
}
message CreateCheckoutResponse {
  string checkout_url = 1 [(zyphor.v1.sensitive) = true];
}

message CancelSubscriptionRequest {
  bool immediate = 1;
  string reason = 2 [
    (buf.validate.field).string.max_len = 1000,
    (zyphor.v1.sensitive) = true
  ];
}
message CancelSubscriptionResponse {}
