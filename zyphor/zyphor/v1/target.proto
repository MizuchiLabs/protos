edition = "2023";

package zyphor.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "zyphor/v1/options.proto";
import "zyphor/v1/principal.proto";

service TargetService {
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/targets/{id}"};
  }
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/targets"};
  }
  rpc CreateTarget(CreateTargetRequest) returns (CreateTargetResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/targets"
      body: "*"
    };
  }
  rpc UpdateTarget(UpdateTargetRequest) returns (UpdateTargetResponse) {
    option (google.api.http) = {
      patch: "/v1/targets/{id}"
      body: "*"
    };
  }
  rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {
    option (google.api.http) = {delete: "/v1/targets/{id}"};
  }
  rpc GetSubjectAccess(GetSubjectAccessRequest) returns (GetSubjectAccessResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/targets/access"
      body: "*"
    };
  }
}

message Target {
  string id = 1;
  string workspace_id = 2;
  string ca_id = 3;
  string agent_id = 4;
  string name = 5;
  string description = 6;
  repeated string endpoints = 7 [(zyphor.v1.sensitive) = true];
  repeated Principal principals = 8;
  TargetMetadata metadata = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
message TargetMetadata {
  // Basic system info
  string hostname = 1;
  string host_id = 2;
  string os = 3;
  string platform = 4;
  string platform_version = 5;
  string architecture = 6;

  // Networking
  repeated string ip_addresses = 7 [(zyphor.v1.sensitive) = true];

  // SSH-specific metadata
  string ssh_version = 8;
  bool ssh_service_running = 9;
  repeated string ssh_ports = 10;

  // Extras
  repeated string tags = 11;
}

message GetTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetTargetResponse {
  Target target = 1;
}

message CreateTargetRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string ca_id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 4 [(buf.validate.field).string.max_len = 1000];
  TargetMetadata metadata = 5;
}
message CreateTargetResponse {
  Target target = 1;
}

message UpdateTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string ca_id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]*$"
  }];
  string description = 4 [(buf.validate.field).string.max_len = 1000];
  repeated string endpoints = 5 [(zyphor.v1.sensitive) = true];
  TargetMetadata metadata = 6;
}
message UpdateTargetResponse {
  Target target = 1;
}

message DeleteTargetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteTargetResponse {}

message ListTargetsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListTargetsResponse {
  repeated Target targets = 1;
}

message AccessibleTarget {
  string agent_id = 1;
  string target_id = 2;
  string target_name = 3;
  string target_description = 4;
  TargetMetadata metadata = 5;
  repeated string endpoints = 6 [(zyphor.v1.sensitive) = true];
  repeated string usernames = 7 [(zyphor.v1.sensitive) = true];
  repeated string principal_ids = 8;
  string ca_id = 9;
  string ca_name = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetSubjectAccessRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string subject_id = 2 [(buf.validate.field).string.uuid = true];
  PrincipalType type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message GetSubjectAccessResponse {
  repeated AccessibleTarget targets = 1;
}
