edition = "2023";

package zerum.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service SecretService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/secrets/{path}/{key}"};
  }
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/secrets/{path}"};
  }
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse) {
    option (google.api.http) = {
      post: "/v1/secrets/{path}/{key}"
      body: "*"
    };
  }
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse) {
    option (google.api.http) = {
      patch: "/v1/secrets/{path}/{key}"
      body: "*"
    };
  }
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (google.api.http) = {delete: "/v1/secrets/{path}/{key}"};
  }
}

message Secret {
  string id = 1;
  string path = 2;
  string key = 3;
  bytes value = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message GetSecretRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}
message GetSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}
message ListSecretsResponse {
  repeated Secret secrets = 1;
}

message CreateSecretRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
  string value = 3 [(buf.validate.field).string.min_len = 1];
  map<string, string> metadata = 4;
}
message CreateSecretResponse {
  Secret secret = 1;
}

message UpdateSecretRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
  string value = 3 [(buf.validate.field).string.min_len = 1];
  map<string, string> metadata = 4;
}
message UpdateSecretResponse {
  Secret secret = 1;
}

message DeleteSecretRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}
message DeleteSecretResponse {}
