edition = "2023";

package zerum.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service ConduitService {
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/conduit/keys/{id}"};
  }
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/conduit/keys"};
  }
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {
    option (google.api.http) = {
      post: "/v1/conduit/keys"
      body: "*"
    };
  }
  rpc UpdateKey(UpdateKeyRequest) returns (UpdateKeyResponse) {
    option (google.api.http) = {
      patch: "/v1/conduit/keys/{id}"
      body: "*"
    };
  }
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {
    option (google.api.http) = {delete: "/v1/conduit/keys/{id}"};
  }
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse) {
    option (google.api.http) = {post: "/v1/conduit/keys/{id}:rotate"};
  }
  rpc Encrypt(EncryptRequest) returns (EncryptResponse) {
    option (google.api.http) = {
      post: "/v1/conduit/keys/{id}:encrypt"
      body: "*"
    };
  }
  rpc Decrypt(DecryptRequest) returns (DecryptResponse) {
    option (google.api.http) = {
      post: "/v1/conduit/keys/{id}:decrypt"
      body: "*"
    };
  }
}

enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;

  // Symmetric AEAD
  ALGORITHM_SECRETBOX = 1;
  ALGORITHM_AES_128_GCM = 2;
  ALGORITHM_AES_256_GCM = 3;
  ALGORITHM_CHACHA20_POLY1305 = 4;

  // Asymmetric
  ALGORITHM_RSA_2048 = 10;
  ALGORITHM_RSA_4096 = 11;

  // ECDSA
  ALGORITHM_ECDSA_P256 = 20;
  ALGORITHM_ECDSA_P384 = 21;
  ALGORITHM_ECDSA_P521 = 22;

  // EdDSA
  ALGORITHM_ED25519 = 30;
}

message ConduitKey {
  string id = 1;
  string project_id = 2;
  string name = 3;
  Algorithm algorithm = 4;
  bool is_active = 5;
  int32 rotation_period = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ConduitKeyVersion {
  string key_id = 1;
  int32 version = 2;
  bool is_active = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetKeyRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
}
message GetKeyResponse {
  ConduitKey key = 1;
  repeated ConduitKeyVersion versions = 2;
}

message ListKeysRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListKeysResponse {
  repeated ConduitKey keys = 1;
}

message CreateKeyRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
  Algorithm algorithm = 3 [(buf.validate.field).enum = {defined_only: true}];
  int32 rotation_period = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 87600
  }];
}
message CreateKeyResponse {
  ConduitKey key = 1;
}

message UpdateKeyRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
  bool is_active = 3;
  int32 rotation_period = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 87600
  }];
}
message UpdateKeyResponse {
  ConduitKey key = 1;
}

message DeleteKeyRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
  int32 version = 3; // optional delete specific version
}
message DeleteKeyResponse {}

message RotateKeyRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
}
message RotateKeyResponse {
  int32 version = 1;
}

message EncryptRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
  bytes plaintext = 3 [(buf.validate.field).bytes.min_len = 1];
  bytes associated_data = 4; // optional AEAD context
}
message EncryptResponse {
  bytes ciphertext = 1;
  int32 version = 2;
}

message DecryptRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9_-]*$"
  ];
  bytes ciphertext = 3 [(buf.validate.field).bytes.min_len = 1];
  bytes associated_data = 4;
}
message DecryptResponse {
  bytes plaintext = 1;
  int32 version = 2;
}
