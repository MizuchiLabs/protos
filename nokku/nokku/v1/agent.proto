edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (google.api.http) = {patch: "/v1/agents/{id}"};
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/agents"};
  }
  rpc RefreshEnrollToken(RefreshEnrollTokenRequest) returns (RefreshEnrollTokenResponse) {
    option (google.api.http) = {post: "/v1/workspaces/{workspace_id}/enroll:refresh"};
  }
  rpc RevokeEnrollToken(RevokeEnrollTokenRequest) returns (RevokeEnrollTokenResponse) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/enroll:revoke"};
  }
  // Session management endpoints
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents/{agent_id}/sessions"};
  }
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {post: "/v1/agents/{agent_id}/sessions"};
  }
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
    option (google.api.http) = {delete: "/v1/agents/{agent_id}/sessions/{session_id}"};
  }
  // Agent only endpoints
  rpc EnrollAgent(EnrollAgentRequest) returns (EnrollAgentResponse);
  rpc SyncAgent(SyncAgentRequest) returns (SyncAgentResponse);
}

// Real-time control stream: one bidirectional stream per agent, long-lived.
// Carries heartbeats and server-to-agent notifications.
service AgentControlService {
  rpc Connect(stream AgentToServer) returns (stream ServerToAgent);
}

// Real-time PTY session stream: one bidirectional stream per active session.
// Opened by the agent after receiving a SessionRequest on the Connect stream.
service AgentSessionService {
  rpc StreamSession(stream SessionToServer) returns (stream SessionToAgent);
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_PENDING = 1;
  AGENT_STATUS_ACCEPTED = 2;
  AGENT_STATUS_REJECTED = 3;
}

message Agent {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  bool online = 4;
  AgentStatus status = 5;
  AgentConfig config = 6;
  map<string, string> metadata = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

// For NATS
message AgentNotification {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_STATUS = 1;
    EVENT_TYPE_PRINCIPALS = 2;
    EVENT_TYPE_CERTIFICATES = 3;
  }
  string agent_id = 1;
  AgentStatus status = 2;
  EventType event_type = 3;
}
message AgentSession {
  string session_id = 1;
  string user_id = 2;
  string username = 3;
}
message AgentConfig {
  bool record_sessions = 1;
}

message GetAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetAgentResponse {
  Agent agent = 1;
}

message UpdateAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  AgentStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0] /* Prevent UNSPECIFIED */
  }];
}
message UpdateAgentResponse {}

message DeleteAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteAgentResponse {}

message ListAgentsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3;
  string query = 4;
  bool online = 5;
  AgentStatus status = 6;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
  int32 total = 2;
}

message RefreshEnrollTokenRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message RefreshEnrollTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeEnrollTokenRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message RevokeEnrollTokenResponse {}

message CreateSessionRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[a-z_][a-z0-9-_]*\\$?$"
  }];
}
message CreateSessionResponse {
  AgentSession session = 1;
  string agent_name = 2;
}

message ListSessionsRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message ListSessionsResponse {
  repeated AgentSession sessions = 1;
  string agent_name = 2;
}

message CloseSessionRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string session_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message CloseSessionResponse {}

message EnrollAgentRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  string ca_id = 2;
}
message EnrollAgentResponse {
  string id = 1;
  string workspace_id = 2;
  string token = 3;
  AgentStatus status = 4;
  AgentConfig config = 5;
}

message PrincipalUsers {
  string username = 1;
  repeated string ids = 2;
}

message SyncAgentRequest {
  repeated string users = 1;
  repeated string private_ips = 2;
  map<string, string> target_metadata = 3;
}
message SyncAgentResponse {
  AgentStatus status = 1;
  AgentConfig config = 2;
  repeated PrincipalUsers principals = 3;
}

// ── Agent Control Stream (AgentControlService.Connect) ─────────────

message AgentToServer {
  oneof msg {
    Heartbeat heartbeat = 1;
    SyncReport sync = 2;
  }
}

message ServerToAgent {
  oneof msg {
    HeartbeatAck heartbeat_ack = 1;
    Notification notification = 2;
    SessionRequest session_request = 3;
  }
}

message Heartbeat {}

message HeartbeatAck {}

message SyncReport {
  repeated string users = 1;
  repeated string private_ips = 2;
  map<string, string> metadata = 3;
}

message Notification {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_STATUS = 1;
    EVENT_TYPE_PRINCIPALS = 2;
    EVENT_TYPE_CERTIFICATES = 3;
    EVENT_TYPE_SYNC_REQUEST = 4;
  }
  EventType event_type = 1;
  string agent_id = 2;
  AgentStatus status = 3;
}

message SessionRequest {
  string session_id = 1;
  string username = 2;
  string user_id = 3;
}

// ── Agent Session Stream (AgentSessionService.StreamSession) ───────

message SessionToServer {
  oneof msg {
    SessionReady ready = 1;
    bytes stdout = 2;
    SessionEnded exited = 3;
  }
}

message SessionToAgent {
  oneof msg {
    SessionStart start = 1;
    bytes stdin = 2;
    ResizeRequest resize = 3;
    CloseRequest close = 4;
  }
}

message SessionStart {
  string session_id = 1;
  string username = 2;
  string user_id = 3;
}

message SessionReady {
  string session_id = 1;
  bytes replay_buffer = 2;
  string username = 3;
  string user_id = 4;
}

message ResizeRequest {
  uint32 width = 1;
  uint32 height = 2;
}

message SessionEnded {
  int32 exit_code = 1;
  string error_message = 2;
}

message CloseRequest {
  string reason = 1;
}
