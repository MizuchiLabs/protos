edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service AgentService {
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (google.api.http) = {patch: "/v1/agents/{id}"};
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/agents"};
  }
  rpc RefreshEnrollToken(RefreshEnrollTokenRequest) returns (RefreshEnrollTokenResponse) {
    option (google.api.http) = {post: "/v1/workspaces/{workspace_id}/enroll:refresh"};
  }
  rpc RevokeEnrollToken(RevokeEnrollTokenRequest) returns (RevokeEnrollTokenResponse) {
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/enroll:revoke"};
  }
  // Session management endpoints
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/agents/{agent_id}/sessions"};
  }
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {post: "/v1/agents/{agent_id}/sessions"};
  }
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
    option (google.api.http) = {delete: "/v1/agents/{agent_id}/sessions/{session_id}"};
  }
  // Agent only endpoints
  rpc EnrollAgent(EnrollAgentRequest) returns (EnrollAgentResponse);
  rpc SyncAgent(SyncAgentRequest) returns (SyncAgentResponse);
  // PTY stream - bidirectional for live terminal sessions
  rpc OpenPTYStream(stream PTYFrame) returns (stream PTYFrame);
  // Agent control - backend pushes commands to agent
  rpc WatchAgentControl(WatchAgentControlRequest) returns (stream AgentControlCommand);
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_PENDING = 1;
  AGENT_STATUS_ACCEPTED = 2;
  AGENT_STATUS_REJECTED = 3;
}

message Agent {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  bool online = 4;
  AgentStatus status = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp created_at = 8;
}
// Agent configuration pushed to agents on heartbeat
message AgentConfig {
  bool record_sessions = 1;
  StorageConfig storage = 2;
}

message StorageConfig {
  enum StorageType {
    STORAGE_TYPE_UNSPECIFIED = 0;
    STORAGE_TYPE_LOCAL = 1;
    STORAGE_TYPE_S3 = 2;
  }
  StorageType type = 1;
  S3Config s3 = 2;
}

message S3Config {
  string bucket = 1;
  string region = 2;
  string endpoint = 3;
  string prefix = 4;
  string access_key_id = 5;
  string secret_access_key = 6;
}

message AgentSession {
  string session_id = 1;
  string user_id = 2;
  string username = 3;
}

message GetAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetAgentResponse {
  Agent agent = 1;
}

message UpdateAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  AgentStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0] /* Prevent UNSPECIFIED */
  }];
}
message UpdateAgentResponse {}

message DeleteAgentRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteAgentResponse {}

message ListAgentsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3;
  string query = 4;
  bool online = 5;
  AgentStatus status = 6;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
  int32 total = 2;
}

message RefreshEnrollTokenRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message RefreshEnrollTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeEnrollTokenRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message RevokeEnrollTokenResponse {}

message CreateSessionRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string username = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[a-z_][a-z0-9-_]*\\$?$"
  }];
}
message CreateSessionResponse {
  AgentSession session = 1;
  string agent_name = 2;
}

message ListSessionsRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message ListSessionsResponse {
  repeated AgentSession sessions = 1;
  string agent_name = 2;
}

message CloseSessionRequest {
  string agent_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string session_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message CloseSessionResponse {}

message EnrollAgentRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  string ca_id = 2;
}
message EnrollAgentResponse {
  string id = 1;
  string workspace_id = 2;
  string token = 3;
  AgentStatus status = 4;
}

message PrincipalUsers {
  string username = 1;
  repeated string ids = 2;
}

message SyncAgentRequest {
  repeated string users = 1;
  repeated string private_ips = 2;
  map<string, string> target_metadata = 3;
}
message SyncAgentResponse {
  AgentStatus status = 1;
  repeated PrincipalUsers principals = 2;
  AgentConfig config = 3;
}

// Agent control - backend-initiated commands
message WatchAgentControlRequest {
  string agent_id = 1;
}

message AgentControlCommand {
  string command = 1;
  map<string, string> params = 2;
}

// PTY stream frames for bidirectional terminal sessions
message PTYFrame {
  oneof frame {
    PTYOpen open = 1;
    PTYData data = 2;
    PTYResize resize = 3;
    PTYClose close = 4;
    PTYAttach attach = 5;
  }
}

message PTYOpen {
  string session_id = 1;
  string user_id = 2;
  string username = 3;
  int32 width = 4;
  int32 height = 5;
}

message PTYData {
  bytes data = 1;
  PTYDataDirection direction = 2;
  string session_id = 3;
}

enum PTYDataDirection {
  PTY_DATA_DIRECTION_UNSPECIFIED = 0;
  PTY_DATA_DIRECTION_STDIN = 1;
  PTY_DATA_DIRECTION_STDOUT = 2;
}

message PTYResize {
  int32 width = 1;
  int32 height = 2;
  string session_id = 3;
}

message PTYClose {
  string reason = 1;
  string session_id = 2;
}

message PTYAttach {
  string session_id = 1;
}
